<section class="recap" aria-label="Bali 2025 recap gallery">
  <div class="recap-head">
    <div>
      <h2 class="recap-title">Moments from <em>2025</em></h2>
    </div>
  </div>

  <div class="recap-progress" aria-hidden="true">
    <div class="recap-progress-rail">
      <div class="recap-progress-fill" id="recap-progress-fill"></div>
    </div>
  </div>

  <div class="recap-controls">
    <button class="recap-arrow" id="recap-prev" type="button" aria-label="Previous recap photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    <div class="recap-counter" aria-live="polite">
      <span id="recap-current">01</span><span>/</span><span id="recap-total">05</span>
    </div>
    <button class="recap-arrow" id="recap-next" type="button" aria-label="Next recap photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </div>

  <div class="recap-track-wrap">
    <div class="recap-track" id="recap-track" tabindex="0" aria-label="Photo slider, use arrow keys to browse">
      <div class="recap-card"><img src="images/recap-1.jpg" alt="MORE TO LIFE 2025 beach club moment"></div>
      <div class="recap-card"><img src="images/recap-2.JPG" alt="MORE TO LIFE 2025 nightlife moment"></div>
      <div class="recap-card"><img src="images/recap-3.jpg" alt="MORE TO LIFE 2025 crowd moment"></div>
      <div class="recap-card"><img src="images/recap-4.jpg" alt="MORE TO LIFE 2025 day trip moment"></div>
      <div class="recap-card"><img src="images/recap-5.jpg" alt="MORE TO LIFE 2025 welcome dinner moment"></div>
    </div>
  </div>
</section>
